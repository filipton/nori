[package]
name = "nori-android"
version.workspace = true
edition.workspace = true

# libnorimusic.so: the core's uniffi JNI scaffolding (build.rs) plus hand-written JNI natives. The name
# must match `cdylib_name` in the core's uniffi.toml.
[lib]
crate-type = ["cdylib"]
name = "norimusic"

[features]
# Beat This! beat detection through tract (nori-engine's feature). On in debug and perf builds, off in release
# unless asked (core/build.gradle.kts): it adds 15.5 MB to the arm64 library.
neural-beats = ["nori-engine/neural-beats"]

[dependencies]
nori-core = { path = "../core" }
# Every crate whose exports the scaffolding covers, each with its uniffi records on.
nori-model = { path = "../model", features = ["ffi"] }
nori-db = { path = "../db", features = ["ffi"] }
nori-net = { path = "../net", features = ["ffi"] }
nori-library = { path = "../library", features = ["ffi"] }
nori-automix = { path = "../automix", features = ["ffi"] }
nori-settings = { path = "../settings", features = ["ffi"] }
nori-lyrics = { path = "../lyrics", features = ["ffi"] }
nori-devices = { path = "../devices", features = ["ffi"] }
nori-queue = { path = "../queue", features = ["ffi"] }
nori-transfers = { path = "../transfers", features = ["ffi"] }
nori-perf = { path = "../perf", features = ["ffi"] }
nori-player = { path = "../player" }
nori-look = { path = "../look" }
nori-covers = { path = "../covers" }
async-trait = "0.1"
nori-engine = { path = "../engine", features = ["core"] }
libc = "0.2"
jni = { version = "0.21", default-features = false }
parking_lot = "0.12"
uniffi = { workspace = true }
# Our patched runtime, under the name the scaffolding uses.
uniffi-bindgen-kotlin-jni-runtime = { package = "nori-uniffi-jni-runtime", path = "../uniffi-jni-runtime" }

[dev-dependencies]
nori-player = { path = "../player", features = ["synth"] }
nori-testdir = { path = "../testdir" }

[build-dependencies]
uniffi-bindgen-kotlin-jni = { workspace = true }
