[package]
name = "nori-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "nori's player for platforms without one: loading, demuxing, the sound chain, transitions and output through a small adapter"

autotests = false

[lib]
name = "nori_engine"

# engine.rs, paths.rs, radio.rs and tempo.rs run as one binary (tests/main.rs), side by side.
[[test]]
name = "engine"
path = "tests/main.rs"

[[test]]
name = "core"
path = "tests/core.rs"

[[test]]
name = "mp4"
path = "tests/mp4.rs"

[[test]]
name = "one_fetch"
path = "tests/one_fetch.rs"

[features]
# The core's queue, transition planner, settings and stream addresses, for a client that links the core.
core = ["dep:nori-core"]
# The optional neural beat tracker: the measurer runs Beat This! over the ends of the songs coming up when
# "Better beat detection" is on. Without it nothing of tract is built or linked.
neural-beats = ["core", "nori-core/neural-beats"]

[dependencies]
nori-player = { path = "../player" }
parking_lot = "0.12"
# Containers: the format readers only. Decoding is nori-player's, so every platform hears the same samples.
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "aac", "isomp4", "ogg", "wav", "pcm", "vorbis", "alac"] }
nori-core = { path = "../core", default-features = false, optional = true }

[dev-dependencies]
nori-testdir = { path = "../testdir" }
nori-player = { path = "../player", features = ["synth"] }
# tests/stretch.rs: the lyrics page's clock, read through a stretched mix as a screen reads it.
nori-look = { path = "../look" }
# tests/core.rs: a transport for the core that is never asked.
async-trait = "0.1"

# The measuring thread's priority, lowered below everything else.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"
