[package]
name = "nori-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "nori's iOS client library: nori-host and the engine behind a C ABI for the UIKit app (docs/site/developers/ipod-internals.md)"
publish = false

# libnori_ios.a: linked into the app by tools/ios-build/build.sh.
[lib]
crate-type = ["staticlib"]
name = "nori_ios"

[dependencies]
nori-core = { path = "../core", default-features = false }
nori-engine = { path = "../engine", features = ["core"] }
nori-host = { path = "../host", default-features = false }
nori-http = { path = "../http" }
nori-covers = { path = "../covers" }
nori-look = { path = "../look" }
nori-player = { path = "../player" }
serde_json = "1"

[dev-dependencies]
nori-testdir = { path = "../testdir" }
# A jam guest's key, for a guest profile.
nori-remote = { path = "../remote" }
# The virtual clock the output's engine test runs on.
nori-engine = { path = "../engine", features = ["core", "testing"] }
nori-player = { path = "../player", features = ["synth"] }
parking_lot = "0.12"
