[package]
name = "nori-player"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "How nori plays music: the sound chain, AutoMix analysis, planning and mixing, shared by every platform"

[lib]
name = "nori_player"

[features]
# Synthetic tracks with a known tempo and structure, and the simulated player in `sim`, for tests.
synth = []
# The optional neural beat tracker, Beat This! through tract (automix/neural.rs, docs/research/analysis.md).
# Without it nothing of tract is compiled or linked; nori-engine's feature of the same name turns it on.
neural-beats = ["dep:tract-onnx", "dep:prost"]

[dependencies]
# AutoMix: the analysis FFT, and Signalsmith Stretch (MIT, C++ built with cc) for tempo changes.
rustfft = "6"
signalsmith-stretch = "0.1"
# The neural beat tracker's runtime: tract, a pure-Rust ONNX runtime (MIT/Apache-2.0). Its default
# "transformers" feature is what runs the model's attention as flash attention (a fifth of the memory);
# neural.rs keeps that on the calling thread, so rayon's pool, which comes with it, is never started.
tract-onnx = { version = "0.23", optional = true }
# The graph's protobuf, read to fill in its weights (automix/weights.rs); the version tract-onnx reads it with.
prost = { version = "0.14", optional = true }
# Decoding: pure Rust codecs only (no containers - the platform's extractor hands in packets).
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "aac", "vorbis", "alac", "pcm"] }
# Opus, which symphonia does not decode: a pure Rust port of libopus (BSD-3).
opus-rs = "0.1.34"
# BS.1770 / EBU R128 loudness (MIT, pure Rust): the K-weighting and the gated integrated loudness AutoMix
# measures each song by (automix/loudness.rs).
ebur128 = "0.1.10"

# Test-only: the resample evaluation compares the transition-time cubic interpolator against a
# sinc resampler. It stays out of release builds.
[dev-dependencies]
rubato = "5.0.0"
# The beat model's weights, checked against their pin in a test (the core checks them the same way).
sha2 = "0.11"
# tests/neural_memory.rs hands freed memory back to the system, as nori-engine's measurer does after a model run.
libc = "0.2"
# The pipeline tests under tests/ drive the simulated player in `sim`, which lives behind `synth`.
nori-player = { path = ".", features = ["synth"] }
