[package]
name = "nori-automix"
version.workspace = true
edition.workspace = true

# AutoMix over the app's database. The analysis and planning themselves are nori-player's.
[lib]
name = "nori_automix"

[features]
# uniffi exports for the Android app's Kotlin bindings.
ffi = ["dep:uniffi", "nori-model/ffi", "nori-db/ffi"]

[dependencies]
uniffi = { workspace = true, optional = true }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
parking_lot = "0.12"
nori-model = { path = "../model" }
nori-db = { path = "../db" }
nori-player = { path = "../player" }

[dev-dependencies]
nori-testdir = { path = "../testdir" }
# Test songs to measure.
nori-player = { path = "../player", features = ["synth"] }
