# Upstream uniffi Kotlin JNI runtime (pinned revision) with nori's Android changes, marked NORI (see src/lib.rs).
# When the revision moves, re-take caching.rs and attach.rs from upstream and reapply the NORI changes.
[package]
name = "nori-uniffi-jni-runtime"
version = "0.31.1"
edition = "2021"
license = "MPL-2.0"
publish = false

[dependencies]
jni-sys = "0.4.1"
uniffi-bindgen-kotlin-jni-runtime = { workspace = true }

# uniffi reads no interface out of this crate.
[package.metadata.uniffi]
skip_parsing = true
