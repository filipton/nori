[package]
name = "nori-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The terminal client: a full-screen music player built from the core, nori-engine and the cpal output, the proof that a new client writes only its interface"

[[bin]]
name = "nori-cli"
path = "src/main.rs"

[features]
# "Better beat detection": the measurer runs Beat This! through tract (nori-engine's feature). Off unless asked
# for, so a plain build links nothing of it.
neural-beats = ["nori-engine/neural-beats"]

[dependencies]
nori-core = { path = "../core", default-features = false }
nori-engine = { path = "../engine", features = ["core"] }
nori-output-cpal = { path = "../output-cpal" }
nori-http = { path = "../http" }
nori-mpris = { path = "../mpris" }
nori-host = { path = "../host" }
nori-covers = { path = "../covers" }
nori-look = { path = "../look" }
parking_lot = "0.12"
# The transport an offline session hands the core (already in the tree through nori-http).
async-trait = "0.1"
# The screen: ratatui over crossterm (its re-export, so the two always agree on a version). MIT.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# Covers in the terminal: kitty graphics, sixel, iTerm2 or half blocks, whichever the terminal answers to.
# Without its default features: no chafa, and image with no codecs (nori-covers decodes). MIT.
ratatui-image = { version = "10.0.8", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false }
libc = "0.2"
# Text cut to the columns it has (already in the tree through ratatui). MIT or Apache-2.0.
unicode-width = "0.2"

[dev-dependencies]
nori-testdir = { path = "../testdir" }
# tests/beat_model.rs loads the model it made.
nori-player = { path = "../player" }
