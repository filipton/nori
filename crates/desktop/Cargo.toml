[package]
name = "nori-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The desktop client: a native window (Slint) over the core, nori-engine and the cpal output, laid out as the terminal client is"

[[bin]]
name = "nori-desktop"
path = "src/main.rs"

[features]
test-control = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
nori-core = { path = "../core", default-features = false }
nori-engine = { path = "../engine", features = ["core"] }
nori-output-cpal = { path = "../output-cpal" }
nori-http = { path = "../http" }
nori-mpris = { path = "../mpris" }
nori-host = { path = "../host" }
nori-covers = { path = "../covers" }
nori-look = { path = "../look" }
parking_lot = "0.12"
# Slint with Skia on wgpu; layers are composited by compositor.rs.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-skia", "unstable-wgpu-30"] }
# Phase-preserving wheel events use Slint's backend API.
i-slint-core = { version = "=1.18.1", default-features = false }
# compositor.rs: winit window and events, pollster for GPU setup, arboard for the clipboard.
winit = "0.30"
# Slint's wgpu, with WGSL for glass.wgsl.
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
pollster = "0.4"
# Slint's Skia version, for measuring lyric text in sung.rs.
skia-safe = "0.153.3"
arboard = { version = "3", default-features = false }

# Menu bar (muda) and unified toolbar (objc2).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSToolbar"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-skia"] }
