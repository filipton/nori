[package]
name = "nori-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The desktop client: a native window (Slint) over the core, nori-engine and the cpal output, laid out as the terminal client is"

[[bin]]
name = "nori-desktop"
path = "src/main.rs"

[dependencies]
nori-core = { path = "../core", default-features = false }
nori-engine = { path = "../engine", features = ["core"] }
nori-output-cpal = { path = "../output-cpal" }
nori-http = { path = "../http" }
nori-mpris = { path = "../mpris" }
nori-covers = { path = "../covers" }
nori-look = { path = "../look" }
parking_lot = "0.12"
# The interface: Slint, each part drawn offscreen by Skia on the GPU (wgpu: Metal on macOS, Vulkan or GL on
# Linux) and put together by our own compositor. GPL-3.0, royalty-free or commercial licences, as Slint
# offers them.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-skia", "unstable-wgpu-30"] }
# Our own window (compositor.rs): winit for the window and its events, wgpu (Slint's, through the feature above)
# to put the layers together, pollster to wait on the GPU's setup, arboard for copy and paste.
winit = "0.30"
# The same wgpu Slint draws with; only so our shaders can be written in WGSL.
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
pollster = "0.4"
arboard = { version = "3", default-features = false }

# The menu bar, macOS's own.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19", default-features = false }

[build-dependencies]
slint-build = "1.18"
