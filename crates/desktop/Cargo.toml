[package]
name = "nori-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The desktop client: a native window (Slint) over the core, nori-engine and the cpal output, laid out as the terminal client is"

[[bin]]
name = "nori-desktop"
path = "src/main.rs"

[dependencies]
nori-core = { path = "../core", default-features = false }
nori-engine = { path = "../engine", features = ["core"] }
nori-output-cpal = { path = "../output-cpal" }
nori-http = { path = "../http" }
nori-mpris = { path = "../mpris" }
nori-covers = { path = "../covers" }
nori-look = { path = "../look" }
parking_lot = "0.12"
# The window: Slint over winit, drawn by Skia on the GPU through wgpu - Metal on macOS, Vulkan (or OpenGL)
# on Linux, X11 and Wayland. No femtovg. `unstable-winit-030` is for the window's attributes (a transparent,
# full-size content view on macOS) and the system blur behind it. GPL-3.0, royalty-free or commercial
# licences, as Slint offers them.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "accessibility", "unstable-winit-030"] }

# The glass behind the window on macOS: the system's own blur (NSVisualEffectView), as Apple's apps have it,
# put beside the view Skia draws into rather than over it (glass.rs). The versions winit already brings.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSVisualEffectView", "NSGraphics", "NSWindow", "NSGlassEffectView", "NSColor", "NSButton", "NSControl"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "CALayer", "CAShapeLayer"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGPath"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.18"
