[package]
name = "nori-core"
version.workspace = true
edition.workspace = true

# The Core and Client objects, their calls into each domain crate, and the domain crates re-exported
# (nori_core::playlist, ::settings_store, ...). See AGENTS.md.

[lib]
crate-type = ["lib"]
name = "nori_core"

[features]
default = ["ffi"]
# The optional neural beat tracker and its model download (enabled by nori-engine's `neural-beats`).
neural-beats = ["nori-player/neural-beats", "dep:sha2"]
# uniffi exports for the Kotlin bindings.
ffi = ["dep:uniffi", "nori-model/ffi", "nori-db/ffi", "nori-net/ffi", "nori-library/ffi", "nori-automix/ffi", "nori-settings/ffi", "nori-lyrics/ffi", "nori-devices/ffi", "nori-queue/ffi", "nori-transfers/ffi", "nori-perf/ffi"]

[dependencies]
uniffi = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
parking_lot = "0.12"
# A refill's album reads side by side rather than one after another.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The local year (this year's albums) from the C library's time zone.
libc = "0.2"
# How music is played - the sound chain and AutoMix - lives in the shared player crate.
nori-player = { path = "../player" }
nori-look = { path = "../look" }
nori-model = { path = "../model" }
nori-db = { path = "../db" }
nori-net = { path = "../net" }
nori-library = { path = "../library" }
nori-automix = { path = "../automix" }
nori-settings = { path = "../settings" }
nori-lyrics = { path = "../lyrics" }
nori-devices = { path = "../devices" }
nori-queue = { path = "../queue" }
nori-transfers = { path = "../transfers" }
nori-perf = { path = "../perf" }
# The beat model's file is checked against its pinned SHA-256.
sha2 = { version = "0.11", optional = true }

[dev-dependencies]
nori-player = { path = "../player", features = ["synth"] }
# The tests' fake transport implements the async Transport trait.
async-trait = "0.1"
# A test's own directory, for a settings database.
nori-testdir = { path = "../testdir" }
